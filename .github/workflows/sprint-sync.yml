name: Validate and sync sprint records
on:
  push:
    branches: [main]
    paths:
      - 'sprints/**'
      - 'docs/PLAN.md'
      - 'scripts/sync_sprints.py'
      - '.github/workflows/sprint-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: sprint-github-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_sprints.py --validate-only
      - name: Synchronize issues and milestones
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_sprints.py --apply
