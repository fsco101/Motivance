name: Android checks
on:
  push:
    paths: ['android/**', 'shared/**', 'web/src/features/exercise/assessment/**', 'web/src/features/exercise/pose/models/**', 'scripts/generate_assessment_cases.py', 'scripts/check_pose_model.py', 'docs/validation/pose-model.json', 'supabase/migrations/**', 'web/src/features/admin/**', 'web/src/data/admin.ts', 'scripts/check_admin_parity.py', 'scripts/test_admin_parity.py', 'docs/architecture/ADMIN-PARITY.md', 'scripts/check_module_boundaries.py', 'scripts/check_apk_native_libraries.py', 'scripts/check_resources.py', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['android/**', 'shared/**', 'web/src/features/exercise/assessment/**', 'web/src/features/exercise/pose/models/**', 'scripts/generate_assessment_cases.py', 'scripts/check_pose_model.py', 'docs/validation/pose-model.json', 'supabase/migrations/**', 'web/src/features/admin/**', 'web/src/data/admin.ts', 'scripts/check_admin_parity.py', 'scripts/test_admin_parity.py', 'docs/architecture/ADMIN-PARITY.md', 'scripts/check_module_boundaries.py', 'scripts/check_apk_native_libraries.py', 'scripts/check_resources.py', '.github/workflows/android-ci.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python scripts/check_admin_parity.py
      - run: python scripts/check_module_boundaries.py
      - run: python scripts/check_resources.py
      - run: python scripts/generate_assessment_cases.py --check
      - run: python scripts/check_pose_model.py
      - run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest :core:domain:test :core:assessment:test --no-daemon
        working-directory: android
      - run: python scripts/check_apk_native_libraries.py
      - uses: actions/upload-artifact@v4
        with:
          name: motivance-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
