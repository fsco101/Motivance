project_id = "motivance"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
shadow_port = 54320
major_version = 15
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1s"
[auth.email.template.confirmation]
subject = "Confirm your Motivance account"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Recover your Motivance account"
content_path = "./supabase/templates/recovery.html"
[analytics]
enabled = false
