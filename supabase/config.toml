project_id = "motivance"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
shadow_port = 54320
major_version = 15
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
# Where Auth may send someone back after Google (#169). The hosted list is set by scripts/configure_google_sign_in.py.
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
enable_signup = true
# Google sign-in (#166). The web app signs in through Auth's redirect, which needs the Web client's secret. Android sends
# Google's ID token, which Google issues for the same Web client ID, so that ID is the one accepted audience. The nonce
# check stays on. Both values come from ignored supabase/.env; docs/operations/GOOGLE-SIGN-IN.md has the console steps.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "1s"
[auth.email.template.confirmation]
subject = "Confirm your Motivance account"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Reset your Motivance password"
content_path = "./supabase/templates/recovery.html"
[analytics]
enabled = false

# Neither function is called with a signed-in person's token. The dispatcher checks its own shared secret, and a calendar
# app has no way to sign in, so a long random token in the link is the key.
[functions.notification-dispatch]
verify_jwt = false

[functions.booking-calendar]
verify_jwt = false
